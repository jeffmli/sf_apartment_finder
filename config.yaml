# Apartment Search Criteria
search_criteria:
  # Location settings
  location: "San Francisco, CA"
  zip_code: ""  # Optional: specify zip code

  # Price range
  min_price: 1500
  max_price: 3500

  # Bedrooms/Bathrooms
  min_bedrooms: 1
  max_bedrooms: 2
  min_bathrooms: 1

  # Property features
  pet_friendly: false
  parking: false
  in_unit_laundry: false

  # Additional filters
  max_results_per_site: 50

# Scraper settings
# Note: Zillow and Apartments.com have strong anti-bot protection and may block requests.
# If you get 403 errors, disable these scrapers and rely on Craigslist.
# Craigslist is generally the most reliable scraper.
scrapers:
  craigslist:
    enabled: true
    base_url: "https://sfbay.craigslist.org"  # Change for your area: seattle, newyork, losangeles, etc.

  zillow:
    enabled: false  # Often blocked - set to false if getting 403 errors
    base_url: "https://www.zillow.com"

  apartments_com:
    enabled: false  # Often blocked - set to false if getting 403 errors
    base_url: "https://www.apartments.com"

# Email settings
email:
  subject: "Daily Apartment Listings - {date}"
  send_time: "09:00"  # Time to send (24-hour format)
  include_images: true
  max_listings_in_email: 30
