name: Daily Apartment Scraper

on:
  # Run daily at 9 AM UTC (adjust timezone as needed)
  schedule:
    - cron: '0 9 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-apartments:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file from secrets
      run: |
        echo "SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}" > .env
        echo "SENDER_PASSWORD=${{ secrets.SENDER_PASSWORD }}" >> .env
        echo "RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}" >> .env

    - name: Create necessary directories
      run: |
        mkdir -p output logs

    - name: Run apartment scraper
      run: python main.py

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-logs-${{ github.run_number }}
        path: logs/
        retention-days: 7

    - name: Upload CSV output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apartment-listings-${{ github.run_number }}
        path: output/*.csv
        retention-days: 30
